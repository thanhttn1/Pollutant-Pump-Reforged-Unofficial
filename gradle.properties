# Memory for Gradle. MDK decompilation needs more than the 1G default, 3G avoids out-of-memory errors on first sync.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false

# Parchment only adds parameter names and javadoc on top of the official Mojang mappings.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.264
loader_version_range=[1,)

# Mod properties
# mod_id must match PollutantPumpApi.MOD_ID and the asset/data folder names.
mod_id=pollutantpumpreforgedunofficial
mod_name=Pollutant Pump Reforged Unofficial
mod_license=GPL-3.0-only
mod_version=1.0.1
mod_group_id=thanhttn1.pollutantpump.reforged
